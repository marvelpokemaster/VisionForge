name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (e.g. 2)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Extract version info
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "VERSION_NAME=${TAG}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=${{ github.event.inputs.version_name || '1.0.0' }}" >> $GITHUB_ENV
          fi
          echo "VERSION_CODE=${{ github.event.inputs.version_code || '2' }}" >> $GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://visionforge-spatial-api.onrender.com
          VITE_SUPABASE_URL: https://btpxwlquhjwjqoypqskm.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0cHh3bHF1aGp3anFveXBxc2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDY1NjUsImV4cCI6MjEwNzg4MjU2NX0.Onih6Am5Ag1xvcyhcLozcgj3zZYlM7qCbT-80YKgPXM
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Android release keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$HOME/.android/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating CI release signing keystore..."
            keytool -genkeypair -v -keystore "$HOME/.android/release.keystore" \
              -alias visionforge -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass visionforge_ci_release -keypass visionforge_ci_release \
              -dname "CN=VisionForge, OU=Spatial, O=VisionForge, L=City, ST=State, C=US"
            echo "RELEASE_KEYSTORE_PATH=$HOME/.android/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=visionforge_ci_release" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=visionforge" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=visionforge_ci_release" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK artifact
        run: |
          APK_SRC="frontend/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="VisionForge-v${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "SHA_PATH=${APK_DEST}.sha256" >> $GITHUB_ENV

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
