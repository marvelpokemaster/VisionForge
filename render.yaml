services:
  - type: web
    name: visionforge-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VISIONFORGE_PERSISTENCE
        value: "supabase"
      - key: SUPABASE_URL
        value: "https://btpxwlquhjwjqoypqskm.supabase.co"
      - key: SUPABASE_KEY
        sync: false
      - key: VISIONFORGE_REQUIRE_AUTH
        value: "1"
      - key: VISIONFORGE_ENV
        value: "production"
