services:
  - type: web
    name: visionforge-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VISIONFORGE_PERSISTENCE
        value: "firebase"
      - key: FIREBASE_PROJECT_ID
        value: "visionforge-spatial"
      - key: VISIONFORGE_REQUIRE_AUTH
        value: "1"
      - key: VISIONFORGE_ENV
        value: "production"
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
